<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนการเดินทาง: โครงการความปลอดภัยรถโรงเรียน</title>
    
    <!-- ฟอนต์ภาษาไทยจาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- นำเข้า D3.js สำหรับสร้างกราฟิกแผนที่ -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        :root {
            --bg-color: #F8F4FF; /* พื้นหลังสีม่วงอ่อนมาก */
            --panel-bg: #FFFFFF;
            --primary-purple: #4A148C;
            --map-default: #E8EAF6; /* สีพื้นประเทศเริ่มต้น */
            --map-border: #C5CAE9;  /* สีเส้นขอบประเทศ */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* แผงควบคุมด้านซ้าย */
        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            box-shadow: 4px 0 15px rgba(74, 20, 140, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .header {
            background-color: var(--primary-purple);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 14px;
            font-weight: 300;
            opacity: 0.9;
        }

        .checklist-container {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .section-title {
            font-weight: 600;
            color: var(--primary-purple);
            margin: 15px 0 10px 0;
            border-bottom: 2px solid #E1BEE7;
            padding-bottom: 5px;
            font-size: 16px;
        }

        /* Checkbox Styles */
        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .checkbox-item:hover {
            background-color: #F3E5F5;
        }

        .checkbox-item input {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #9C27B0;
            border-radius: 4px;
            margin-right: 12px;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: all 0.2s;
        }

        .checkbox-item input:checked {
            background-color: var(--chk-color, #9C27B0);
            border-color: var(--chk-color, #9C27B0);
        }

        .checkbox-item input:checked::after {
            content: '✔';
            color: white;
            position: absolute;
            top: -2px;
            left: 3px;
            font-size: 14px;
        }

        .province-name {
            font-size: 15px;
            flex-grow: 1;
        }

        .mode-icon {
            font-size: 16px;
        }

        /* พื้นที่แผนที่ */
        #map-container {
            flex-grow: 1;
            height: 100%;
            position: relative;
            background: radial-gradient(circle, #ffffff 0%, var(--bg-color) 100%);
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* CSS สำหรับส่วนต่างๆ ใน SVG */
        .province-path {
            fill: var(--map-default);
            stroke: var(--map-border);
            stroke-width: 0.5;
            transition: fill 0.3s, opacity 0.3s;
        }

        .province-path:hover {
            stroke: #9C27B0;
            stroke-width: 1.5;
        }

        .connection-line {
            fill: none;
            stroke-width: 2;
            opacity: 0.7;
            stroke-dasharray: 4 2;
            transition: opacity 0.3s;
        }

        .target-group {
            transition: opacity 0.3s;
        }

        .target-group.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* กล่องข้อความบนขอบ */
        .label-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            font-family: 'Kanit', sans-serif;
            width: 180px;
            height: 50px;
            box-sizing: border-box;
            border-left: 6px solid rgba(255,255,255,0.7);
        }

        .label-text strong {
            display: block;
            font-size: 16px;
            line-height: 1;
            margin-bottom: 4px;
        }

        .label-text span {
            font-size: 13px;
            font-weight: 300;
            opacity: 0.95;
            display: block;
            line-height: 1;
        }

        .label-icon {
            font-size: 24px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: var(--primary-purple);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- แผงควบคุมด้านซ้าย -->
    <div id="sidebar">
        <div class="header">
            <h1>โครงการความปลอดภัย<br>รถรับส่งนักเรียน</h1>
            <p>แผนการเดินทาง 10 จังหวัด</p>
        </div>
        <div class="checklist-container">
            <div class="section-title">✈️ เดินทางด้วยเครื่องบิน (6 จังหวัด)</div>
            <div id="plane-checklist"></div>

            <div class="section-title" style="margin-top: 25px;">🚐 เดินทางด้วยรถตู้ (4 จังหวัด)</div>
            <div id="van-checklist"></div>
        </div>
    </div>

    <!-- พื้นที่แสดงผลกราฟิก (D3.js) -->
    <div id="map-container">
        <div id="loading">กำลังสร้างกราฟิกประเทศไทย...</div>
    </div>

    <script>
        // 1. ข้อมูลการตั้งค่า 10 จังหวัด (แยกซ้าย-ขวา เพื่อไม่ให้กล่องทับซ้อนกัน และตั้งตำแหน่งแกน Y ตายตัว)
        // ใช้สีสันที่แตกต่างกัน 10 สี (RGB format)
        const targetProvinces = [
            // ด้านซ้าย (เครื่องบิน 3, รถตู้ 2)
            { id: 'chiangmai', th: 'เชียงใหม่', match: ['Chiang Mai'], mode: 'เครื่องบิน', icon: '✈️', align: 'left', y: 80, rgb: '239, 68, 68' },      // สีแดง
            { id: 'nan', th: 'น่าน', match: ['Nan'], mode: 'เครื่องบิน', icon: '✈️', align: 'left', y: 200, rgb: '249, 115, 22' },       // สีส้ม
            { id: 'suphanburi', th: 'สุพรรณบุรี', match: ['Suphan Buri', 'Suphanburi'], mode: 'รถตู้', icon: '🚐', align: 'left', y: 360, rgb: '234, 179, 8' }, // สีเหลืองทอง
            { id: 'kanchanaburi', th: 'กาญจนบุรี', match: ['Kanchanaburi'], mode: 'รถตู้', icon: '🚐', align: 'left', y: 480, rgb: '34, 197, 94' },   // สีเขียว
            { id: 'nakhonsi', th: 'นครศรีธรรมราช', match: ['Nakhon Si Thammarat'], mode: 'เครื่องบิน', icon: '✈️', align: 'left', y: 720, rgb: '6, 182, 212' }, // สีฟ้า

            // ด้านขวา (เครื่องบิน 3, รถตู้ 2)
            { id: 'khonkaen', th: 'ขอนแก่น', match: ['Khon Kaen'], mode: 'เครื่องบิน', icon: '✈️', align: 'right', y: 200, rgb: '59, 130, 246' },      // สีน้ำเงิน
            { id: 'ayutthaya', th: 'พระนครศรีอยุธยา', match: ['Phra Nakhon Si Ayutthaya', 'Ayutthaya'], mode: 'รถตู้', icon: '🚐', align: 'right', y: 340, rgb: '99, 102, 241' }, // สีคราม
            { id: 'chonburi', th: 'ชลบุรี', match: ['Chon Buri', 'Chonburi'], mode: 'รถตู้', icon: '🚐', align: 'right', y: 460, rgb: '236, 72, 153' },     // สีชมพู
            { id: 'surin', th: 'สุรินทร์', match: ['Surin'], mode: 'เครื่องบิน', icon: '✈️', align: 'right', y: 600, rgb: '168, 85, 247' },         // สีม่วง
            { id: 'songkhla', th: 'สงขลา', match: ['Songkhla'], mode: 'เครื่องบิน', icon: '✈️', align: 'right', y: 820, rgb: '225, 29, 72' }         // สีแดงอมชมพู
        ];

        // 2. ตั้งค่า SVG Viewbox สำหรับแสดงผล
        const width = 1000;
        const height = 900;
        const mapContainer = d3.select("#map-container");
        
        const svg = mapContainer.append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        // สร้าง <defs> สำหรับทำหัวลูกศรแต่ละสี
        const defs = svg.append("defs");
        targetProvinces.forEach(prov => {
            defs.append("marker")
                .attr("id", `arrow-${prov.id}`)
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 8)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", `rgb(${prov.rgb})`);
        });

        // 3. ฟังก์ชันตรวจสอบชื่อจังหวัด
        function isTargetProvince(feature) {
            const props = feature.properties;
            const values = Object.values(props).map(v => String(v).toLowerCase());
            
            for (let i = 0; i < targetProvinces.length; i++) {
                const target = targetProvinces[i];
                // ค้นหาจากชื่อภาษาไทย หรือ ภาษาอังกฤษ
                const isMatch = values.some(v => v.includes(target.th)) || 
                                target.match.some(eng => values.some(v => v.includes(eng.toLowerCase())));
                
                if (isMatch) return target;
            }
            return null;
        }

        // 4. สร้าง UI Checkbox ฝั่งซ้าย
        function createSidebar() {
            const planeContainer = document.getElementById('plane-checklist');
            const vanContainer = document.getElementById('van-checklist');

            targetProvinces.forEach(prov => {
                const label = document.createElement('label');
                label.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.dataset.id = prov.id;
                checkbox.style.setProperty('--chk-color', `rgb(${prov.rgb})`);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'province-name';
                textSpan.textContent = prov.th;

                const iconSpan = document.createElement('span');
                iconSpan.className = 'mode-icon';
                iconSpan.textContent = prov.icon;

                label.appendChild(checkbox);
                label.appendChild(textSpan);
                label.appendChild(iconSpan);

                if (prov.mode === 'เครื่องบิน') {
                    planeContainer.appendChild(label);
                } else {
                    vanContainer.appendChild(label);
                }

                // Event Listener สำหรับเปิด/ปิดกราฟิก
                checkbox.addEventListener('change', (e) => {
                    const isChecked = e.target.checked;
                    const group = d3.select(`#group-${prov.id}`);
                    const path = d3.select(`#path-${prov.id}`);

                    if (isChecked) {
                        group.classed("hidden", false);
                        path.style("fill", `rgba(${prov.rgb}, 0.8)`);
                    } else {
                        group.classed("hidden", true);
                        path.style("fill", "var(--map-default)");
                    }
                });
            });
        }

        // 5. โหลดข้อมูล GeoJSON ของประเทศไทย และวาดกราฟิก
        const geojsonUrl = 'https://raw.githubusercontent.com/apisit/thailand.json/master/thailand.json';

        d3.json(geojsonUrl).then(data => {
            document.getElementById('loading').style.display = 'none';
            createSidebar();

            // การตั้งค่า Projection เพื่อจำกัดพื้นที่แผนที่ให้อยู่ตรงกลาง (เว้นที่ซ้าย/ขวาให้ Text box)
            // margin-left: 280, margin-right: 280
            const projection = d3.geoMercator().fitExtent([[280, 40], [720, 860]], data);
            const pathGenerator = d3.geoPath().projection(projection);

            // Group สำหรับแผนที่
            const mapLayer = svg.append("g").attr("class", "map-layer");
            // Group สำหรับเส้นและกล่องข้อความ
            const overlayLayer = svg.append("g").attr("class", "overlay-layer");

            // เก็บพิกัดกึ่งกลางเพื่อลากเส้น
            const centers = {};

            // วาดรูปร่างประเทศ (ทุกจังหวัด)
            mapLayer.selectAll("path")
                .data(data.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "province-path")
                .attr("id", d => {
                    const target = isTargetProvince(d);
                    if (target) {
                        centers[target.id] = pathGenerator.centroid(d);
                        return `path-${target.id}`;
                    }
                    return null;
                })
                .style("fill", d => {
                    const target = isTargetProvince(d);
                    return target ? `rgba(${target.rgb}, 0.8)` : "var(--map-default)";
                });

            // วาดกล่องข้อความและเส้นเชื่อม
            targetProvinces.forEach(prov => {
                if (!centers[prov.id]) return; // ข้ามถ้าหาพิกัดไม่พบ

                const [cx, cy] = centers[prov.id];
                const boxWidth = 200;
                const boxHeight = 60;
                
                // กำหนดตำแหน่งกล่องข้อความ (ให้อยู่ขอบซ้าย หรือ ขอบขวาของ Viewbox)
                const startX = prov.align === 'left' ? 20 : width - boxWidth - 20;
                const startY = prov.y;

                // จุดเริ่มต้นของเส้น (ออกจากด้านข้างของกล่อง)
                const lineStartX = prov.align === 'left' ? startX + boxWidth : startX;
                const lineStartY = startY + (boxHeight / 2);

                const group = overlayLayer.append("g")
                    .attr("class", "target-group")
                    .attr("id", `group-${prov.id}`);

                // วาดเส้นแบบ S-Curve อ่อนๆ ชี้เป้า
                const curveX = (lineStartX + cx) / 2;
                const pathString = `M ${lineStartX},${lineStartY} C ${curveX},${lineStartY} ${curveX},${cy} ${cx},${cy}`;

                group.append("path")
                    .attr("class", "connection-line")
                    .attr("d", pathString)
                    .attr("stroke", `rgb(${prov.rgb})`)
                    .attr("marker-end", `url(#arrow-${prov.id})`);

                // จุดวงกลมตรงเป้าหมาย
                group.append("circle")
                    .attr("cx", cx)
                    .attr("cy", cy)
                    .attr("r", 4)
                    .attr("fill", `rgb(${prov.rgb})`)
                    .attr("stroke", "#fff")
                    .attr("stroke-width", 1.5);

                // วาดกล่องข้อความ (ใช้ foreignObject เพื่อใช้ HTML/CSS สวยๆ ใน SVG)
                group.append("foreignObject")
                    .attr("x", startX)
                    .attr("y", startY)
                    .attr("width", boxWidth)
                    .attr("height", boxHeight + 10)
                    .append("xhtml:div")
                    .html(`
                        <div class="label-box" style="background: rgba(${prov.rgb}, 0.85);">
                            <div class="label-text">
                                <strong>${prov.th}</strong>
                                <span>${prov.mode}</span>
                            </div>
                            <div class="label-icon">${prov.icon}</div>
                        </div>
                    `);
            });

        }).catch(err => {
            document.getElementById('loading').innerHTML = "เกิดข้อผิดพลาดในการโหลดข้อมูลแผนที่ <br>กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต";
            console.error(err);
        });
    </script>
</body>
</html>
